# XcodeGen spec for the iOS/iPadOS app. Regenerate the committed project after editing:
#   cd iosApp && xcodegen generate
name: royaleAssist
options:
  bundleIdPrefix: com.macle
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Listed so the targets' config file gets a stable place in the project.
fileGroups:
  - Config
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  royaleAssist:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # The Apple team for device installs comes from Local.xcconfig (gitignored), see Config/Signing.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: royaleAssist
    dependencies:
      # The screen broadcast (ReplayKit upload extension), embedded in PlugIns.
      - target: royaleAssistBroadcast
    entitlements:
      path: royaleAssist/royaleAssist.entitlements
      properties:
        # Shared with the broadcast extension: it leaves the newest screen frame there.
        com.apple.security.application-groups:
          - group.com.macle.royaleassist
    settings:
      base:
        PRODUCT_NAME: royaleAssist
        PRODUCT_BUNDLE_IDENTIFIER: com.macle.royaleassist
        INFOPLIST_FILE: royaleAssist/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Kotlin Multiplatform direct integration (static framework "Shared" from :shared).
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          # Xcode's PATH has a newer JDK than Gradle and the Android plugin support; use JDK 21.
          export JAVA_HOME="${ROYALEASSIST_JAVA_HOME:-/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home}"
          # Low-memory defaults for an 8 GB Mac; override with ROYALEASSIST_GRADLE_ARGS.
          GRADLE_ARGS="${ROYALEASSIST_GRADLE_ARGS:---no-daemon -Dorg.gradle.jvmargs=-Xmx2g --max-workers=1}"
          cd "$SRCROOT/.."
          ./gradlew $GRADLE_ARGS :shared:embedAndSignAppleFrameworkForXcode
  royaleAssistBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: royaleAssistBroadcast
    entitlements:
      path: royaleAssistBroadcast/royaleAssistBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.macle.royaleassist
    settings:
      base:
        PRODUCT_NAME: royaleAssistBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.macle.royaleassist.broadcast
        INFOPLIST_FILE: royaleAssistBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  royaleAssist:
    build:
      targets:
        royaleAssist: all
    run:
      config: Debug
    archive:
      config: Release
